<html>
	<!-- if i write children nested in a tag -->
	<!-- i will always tab over the child -->
	<!-- you could also do 4 spaces -->
	<head>
		<title>class 11 🤠</title>

		<!-- using the script tag to link our js file -->
		<!-- script tags are not self enclosing -->
		<!-- if you change the name of the file, you need to change the name of the file here -->
		<script src="main.js"></script>

		<!-- link is for css ONLY -->
		<link rel="stylesheet" href="style.css">
	</head>
	<body>

		<p>
			this is a plain paragraph
		</p>
		<p class="red-paragraph">
			this is red paragraph 1
		</p>
		<p class="red-paragraph">
			this is red paragraph 2
		</p>
		<p class="red-paragraph">
			this is red paragraph 3
		</p>
		<p id="big-paragraph">
			this is a big paragraph
		</p>

		<p id="another">
			this is another paragraph
		</p>

		<p id="special"> 
			special paragraph!!!!!
		</p>

		<div id="container">
		</div>
	</body>
</html>
