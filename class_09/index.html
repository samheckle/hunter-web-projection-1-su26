<html>
	<head>
		<title> class 9 🫶 </title>
		<link rel="stylesheet" href="style.css">
	</head>
	<body>
		<!-- divs are diving elements and we use them to group -->
		<div class="container">
			<div class="grid-item">
				item 1
			</div>
			<div class="grid-item">
				item 2
			</div>
			<div class="grid-item">
				item 3
			</div>
			<div class="grid-item">
				item 4
			</div>

				item 5
			</div>
			<div class="grid-item hidden">

			</div>
			<div class="grid-item">
				<span>item 5</span>
			</div>
			<div class="grid-item hidden">
				<span>item 5</span>
			</div>
			<div class="grid-item hidden">
				<span>item 5</span>
			</div>
			<div class="grid-item hidden">
				<span>item 5</span>
			</div>
			<div class="grid-item positioned">
				item 5
			</div>
		</div>
	</body>
</html>
